    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4Z"/></svg>
  </div>
  <h3 class="mt-5 font-serif text-lg font-semibold text-brand-ink">{{feature.title}}</h3>
  <p class="mt-2 text-sm text-slate-600">{{feature.summary}}</p>
</article>
